# Run the exhaustive release gates before merge, without registry credentials or publishing.
name: Release readiness

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-readiness-${{ github.ref }}
  cancel-in-progress: true

jobs:
  conformance:
    name: Full SQL and simulator conformance
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - run: bash scripts/ci-install.sh
      - run: npm run test:sql:full
      - run: npm run test:simulator:full

  browser-conformance:
    name: Full browser conformance (${{ matrix.browser }} ${{ matrix.shard }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 360
    strategy:
      fail-fast: false
      matrix:
        # Playwright shards split each engine's conformance suite by test; every shard must pass
        # (a flaky test still fails its shard). WebKit, on macOS's single worker, ran 32-36 min
        # whole.
        include:
          - browser: chromium
            shard: 1/2
            os: ubuntu-latest
            cache_path: ~/.cache/ms-playwright
          - browser: chromium
            shard: 2/2
            os: ubuntu-latest
            cache_path: ~/.cache/ms-playwright
          - browser: firefox
            shard: 1/2
            os: ubuntu-latest
            cache_path: ~/.cache/ms-playwright
          - browser: firefox
            shard: 2/2
            os: ubuntu-latest
            cache_path: ~/.cache/ms-playwright
          - browser: webkit
            shard: 1/3
            os: macos-latest
            cache_path: ~/Library/Caches/ms-playwright
          - browser: webkit
            shard: 2/3
            os: macos-latest
            cache_path: ~/Library/Caches/ms-playwright
          - browser: webkit
            shard: 3/3
            os: macos-latest
            cache_path: ~/Library/Caches/ms-playwright
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - run: bash scripts/ci-install.sh
      - name: Resolve Playwright version
        id: playwright
        run: echo "version=$(node -p "require('@playwright/test/package.json').version")" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@v6
        id: browser
        with:
          path: ${{ matrix.cache_path }}
          key: playwright-${{ runner.os }}-${{ matrix.browser }}-${{ steps.playwright.outputs.version }}
      - name: Install browser
        run: npx playwright install ${{ matrix.browser }}
        if: steps.browser.outputs.cache-hit != 'true'
      - name: Install browser system dependencies
        run: npx playwright install-deps ${{ matrix.browser }}
        if: runner.os == 'Linux'
      - run: npm run test:browser:conformance -- --project ${{ matrix.browser }} --shard ${{ matrix.shard }}
      - name: Upload browser reports, traces, and plans
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: readiness-browser-conformance-${{ matrix.browser }}-${{ strategy.job-index }}
          path: |
            playwright-report/
            test-results/
          retention-days: 14
