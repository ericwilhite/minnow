# Run the exhaustive release gates before merge, without registry credentials or publishing.
name: Release readiness

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-readiness-${{ github.ref }}
  cancel-in-progress: true

jobs:
  conformance:
    name: Full SQL and simulator conformance
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run test:sql:full
      - run: npm run test:simulator:full

  browser-conformance:
    name: Full browser conformance (${{ matrix.browser }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 360
    strategy:
      fail-fast: false
      matrix:
        include:
          - browser: chromium
            os: ubuntu-latest
            cache_path: ~/.cache/ms-playwright
          - browser: firefox
            os: ubuntu-latest
            cache_path: ~/.cache/ms-playwright
          - browser: webkit
            os: macos-latest
            cache_path: ~/Library/Caches/ms-playwright
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Resolve Playwright version
        id: playwright
        run: echo "version=$(node -p "require('@playwright/test/package.json').version")" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@v6
        id: browser
        with:
          path: ${{ matrix.cache_path }}
          key: playwright-${{ runner.os }}-${{ matrix.browser }}-${{ steps.playwright.outputs.version }}
      - name: Install browser
        run: npx playwright install ${{ matrix.browser }}
        if: steps.browser.outputs.cache-hit != 'true'
      - name: Install browser system dependencies
        run: npx playwright install-deps ${{ matrix.browser }}
        if: runner.os == 'Linux'
      - run: npm run test:browser:conformance -- --project ${{ matrix.browser }}
      - name: Upload browser reports, traces, and plans
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: readiness-browser-conformance-${{ matrix.browser }}
          path: |
            playwright-report/
            test-results/
          retention-days: 14
