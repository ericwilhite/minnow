# The browser performance lane, nightly and off the merge path.
#
# Minnow against SQLite-Wasm (point suite) and single-thread DuckDB-Wasm (analytics suite) in real
# Chromium, with the browser profile -- and so OPFS -- on the runner's disk. Like the Node gate it
# judges ratios against a competitor measured in the same run, confirms a flagged cell in a fresh
# browser before failing, and never blocks a merge: a shared runner measures itself as much as the
# code. Unlike the Node gate it also fails at once when a Minnow store will not reopen after a
# failed cell, or when Minnow's answer differs from the competitor's.
#
# The owner lane (job `owner`) is the next core's cross-tab point-read latency in Chromium, Firefox
# and WebKit: ruling R22.3 judges R6's absolute targets here (MINNOW_PERF_LANE=1), not on loaded
# shared hosts, where the lane records them without enforcing.
name: Browser performance

on:
  schedule:
    # 08:00 UTC daily, after the Node performance gate.
    - cron: "0 8 * * *"
  workflow_dispatch:
    inputs:
      scale:
        description: "Analytics datasets: default (W1M, W500, S1), large (W5M, S5), or all"
        default: default
        type: choice
        options: [default, large, all]
      update:
        description: "Recalibrate this runner's baseline profile and upload the file (no judging)"
        default: false
        type: boolean

permissions:
  contents: read

jobs:
  lane:
    name: Browser performance lane
    runs-on: ubuntu-latest
    # Measured locally (8 threads, busy): a whole default run -- the point suite, then W1M, W500 and
    # S1 including their first loads and one W1M reload after a corrupted store -- took 62 minutes;
    # with the datasets cached, about 45. A 4-vCPU runner is slower and loads every night, so the
    # default run gets 240 minutes. The large scales take hours and are opt-in.
    timeout-minutes: ${{ (inputs.scale || 'default') == 'default' && 240 || 355 }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - run: bash scripts/ci-install.sh
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Run the lane
        # An explicit Bash shell enables pipefail, so tee cannot turn a failed lane into a green job.
        shell: bash
        env:
          # On the runner's disk, never tmpfs; the lane refuses a memory filesystem. The `runner`
          # context is only available at step level.
          MINNOW_BROWSER_PERF_DIR: ${{ runner.temp }}/minnow-browser-perf
        run: >-
          npm run benchmark:browser --
          --scale=${{ inputs.scale || 'default' }}
          --out=browser-perf-results
          ${{ inputs.update && '--update' || '' }}
          2>&1 | tee browser-perf.txt
      - name: Storage microbench (rebuild core, recorded, not judged)
        # The rebuild core's storage in real Chromium on the runner's disk, OPFS and IndexedDB:
        # cache hits, a cold coalesced slab read, publish latency, commit latency with and without
        # a log flush. Recorded nightly next to the lane's results; nothing judges it yet.
        if: always()
        shell: bash
        run: |
          mkdir -p browser-perf-results
          npm run benchmark:storage 2>&1 | tee storage-microbench.txt
          grep -o 'STORAGE_MICROBENCH .*' storage-microbench.txt | sed 's/^STORAGE_MICROBENCH //' \
            > browser-perf-results/storage-microbench.json
      - name: Aggregation microbench (rebuild core, recorded, not judged)
        # The analytics harness's aggregation shapes (agg_highcard_int, agg_3dims_20aggs,
        # agg_count_distinct, agg_numeric_sum) through the rebuild core's aggregate operator in
        # real Chromium: prebuilt batches, operator cost only, wall time min and median of five.
        # Recorded nightly so layout changes (row layout, partitioning) are measured on a quiet
        # host; nothing judges it.
        if: always()
        shell: bash
        run: |
          mkdir -p browser-perf-results
          npm run benchmark:agg-browser 2>&1 | tee agg-microbench.txt
          grep -o 'AGG_MICROBENCH .*' agg-microbench.txt | sed 's/^AGG_MICROBENCH //' \
            > browser-perf-results/agg-microbench.json
      - name: Export bench (rebuild core, recorded, not judged)
        # Gate A's streaming export in real Chromium on the runner's disk: the wide table
        # (1,048,576 rows x 200 columns, about 1.1 GB of OPFS) written through the rebuild core's
        # OPFS backend, then cold and warm passes, per-column readahead and the row window.
        # Recorded per pass: rows/s, the export worker's CPU seconds and rows per CPU-second,
        # renderer RSS peak, worker heap and pool residency. Gate A's >= 190k rows/s cold is
        # judged here once it is, not yet (lead ruling: record only, like the storage microbench).
        # A runner whose disk cannot take the table can lower MINNOW_EXPORT_ROWS.
        if: always()
        shell: bash
        env:
          MINNOW_EXPORT_ROWS: "1048576"
        run: |
          mkdir -p browser-perf-results
          npm run benchmark:export 2>&1 | tee export-bench.txt
          grep -o 'EXPORT_BENCH .*' export-bench.txt | sed 's/^EXPORT_BENCH //' \
            > browser-perf-results/export-bench.json
      - name: Upload the results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: browser-perf
          path: |
            browser-perf.txt
            storage-microbench.txt
            agg-microbench.txt
            export-bench.txt
            browser-perf-results/
            packages/core/browser-perf-baseline.json
          retention-days: 90

  owner:
    name: Owner latency lane (R6)
    runs-on: ubuntu-latest
    # The latency spec takes about two minutes per engine on a quiet runner; installs dominate.
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - run: bash scripts/ci-install.sh
      - name: Install the browsers
        run: npx playwright install --with-deps chromium firefox webkit
      - name: Run the owner latency lane
        shell: bash
        env:
          MINNOW_PERF_LANE: "1"
        run: >-
          npm run test:browser:next-owner --
          packages/core/browser-tests/next-owner-latency.spec.ts
          2>&1 | tee owner-lane.txt
      - name: Upload the results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: owner-lane
          path: |
            owner-lane.txt
            playwright-report/
          retention-days: 90
