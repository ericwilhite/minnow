# The merge gate. Everything here must pass before a change lands on main.
#
# Split by failure domain: `check` catches most mistakes, the browser matrix proves storage and
# site behavior a Node substitute cannot, and `engines-floor` proves the oldest Node the package
# claims to support still runs the suite. The performance gate deliberately lives in its own
# scheduled workflow — it measures a machine as much as the code, so it must never block a merge.
name: CI

on:
  push:
    branches: [main]
  pull_request:

# A newer push to the same branch makes the older run irrelevant.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    name: Format, types, lint, build, unit tests
    runs-on: ubuntu-latest
    # The heaviest maintenance and conformance tests are each allowed 300 s under coverage; the
    # sum has to fit here with room for the build and lint steps ahead of them.
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      # First, because a version that only moved on one package is a broken install rather than a
      # broken build, and nothing later in this job would notice.
      - run: npm run version:check
      - run: npm run format
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run build
      # The public API surface is a contract: an unclassified subpath, a declaration change, or a
      # type-only export turning runtime fails here, matching the pre-push hook's gate.
      - run: npm run api:check
      # Coverage rather than a bare run: the thresholds in vitest.config.ts are a ratchet, and a
      # ratchet nothing turns is just a number in a file.
      - run: npm run test:coverage
      # The committed portable SQLLogicTest profile adds 6,345 result-checked queries without
      # network access. It is intentionally standard local/PR coverage, not a nightly-only net.
      - run: npm run test:sql:standard
      - name: Upload coverage
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: coverage
          path: coverage/
          retention-days: 14

  memory:
    name: Heap plateau
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      # Forced-GC samples across repeated queries, writes, live subscriptions, and database
      # lifecycles. Caches may warm once; a continuing post-warmup climb fails the merge gate.
      - run: npm run soak:memory

  browser-matrix:
    name: Real browser (${{ matrix.browser }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - browser: chromium
            os: ubuntu-latest
            cache_path: ~/.cache/ms-playwright
          - browser: firefox
            os: ubuntu-latest
            cache_path: ~/.cache/ms-playwright
          - browser: webkit
            os: macos-latest
            cache_path: ~/Library/Caches/ms-playwright
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      # Cache each browser against the Playwright version that asks for it.
      - name: Resolve Playwright version
        id: playwright
        run: echo "version=$(node -p "require('@playwright/test/package.json').version")" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@v6
        id: browser
        with:
          path: ${{ matrix.cache_path }}
          key: playwright-${{ runner.os }}-${{ matrix.browser }}-${{ steps.playwright.outputs.version }}
      - name: Install browser
        run: npx playwright install ${{ matrix.browser }}
        if: steps.browser.outputs.cache-hit != 'true'
      - name: Install browser system dependencies
        run: npx playwright install-deps ${{ matrix.browser }}
        if: runner.os == 'Linux'
      - name: Test library in ${{ matrix.browser }}
        id: library
        run: npm run test:browser:library -- --project ${{ matrix.browser }}
      - name: Upload library reports, traces, and plans
        if: always() && (steps.library.outcome == 'success' || steps.library.outcome == 'failure')
        uses: actions/upload-artifact@v7
        with:
          name: playwright-library-${{ matrix.browser }}
          path: |
            playwright-report/
            test-results/
          retention-days: 14
      - name: Test site in ${{ matrix.browser }}
        id: site
        run: npm run test:browser:site -- --project ${{ matrix.browser }}
      - name: Upload site reports, traces, and plans
        if: always() && (steps.site.outcome == 'success' || steps.site.outcome == 'failure')
        uses: actions/upload-artifact@v7
        with:
          name: playwright-site-${{ matrix.browser }}
          path: |
            playwright-report/
            test-results/
          retention-days: 14
      # Pack and install every library outside the workspace, then build and run a real consumer.
      # This catches missing tarball files, dependency ranges, declarations, and worker chunks that
      # workspace links cannot expose. It launches Chromium, so run it once on that installed leg.
      - name: Test packed consumer
        if: matrix.browser == 'chromium'
        run: npm run test:consumer

  # Preserve the stable required-check name while making any failed, cancelled, or skipped matrix
  # result fail the aggregate gate.
  browser:
    name: Real browsers
    if: always()
    needs: browser-matrix
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Require every browser engine
        env:
          BROWSER_MATRIX_RESULT: ${{ needs.browser-matrix.result }}
        run: test "$BROWSER_MATRIX_RESULT" = "success"

  engines-floor:
    name: Unit tests on the oldest supported Node
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          # package.json declares ">=22". This job is what makes that claim true rather than
          # aspirational — node:sqlite in particular moved between 22 and 24.
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npm run test:unit
