# The merge gate. Everything here must pass before a change lands on main.
#
# Split by failure domain: the static checks catch most mistakes, the unit suite proves behavior
# and holds the coverage floors, the browser matrix proves storage and site behavior a Node
# substitute cannot, and the oldest-Node suite proves the oldest Node the package claims to support
# still runs it. The performance gate deliberately lives in its own scheduled workflow — it
# measures a machine as much as the code, so it must never block a merge.
#
# The long suites are spread across parallel runners. Each split gate ends in an aggregate job
# with a stable name — `Format, types, lint, build, unit tests`, `Unit tests on the oldest
# supported Node`, and `Real browsers` — that fails unless every part of it passed, so a required
# check names the gate rather than however it happens to be split.
name: CI

on:
  push:
    branches: [main]
  pull_request:

# A newer push to the same branch makes the older run irrelevant.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  static:
    name: Format, types, lint, build, API contract, SQLLogicTest
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - run: bash scripts/ci-install.sh
      # First, because a version that only moved on one package is a broken install rather than a
      # broken build, and nothing later in this job would notice.
      - run: npm run version:check
      - run: npm run format
      # On this fresh checkout, its `tsc -b --force` is the clean package build: there is no
      # earlier output to reuse. The site, scripts, and browser harnesses are checked against it.
      - run: npm run typecheck
      - run: npm run lint
      # `npm run build` is `clean`, that same forced package build, then the site. The packages
      # were just built from scratch by the step above, so only the site is left to build.
      - name: Build the site
        run: npm run site:build
      # The public API surface is a contract: an unclassified subpath, a declaration change, or a
      # type-only export turning runtime fails here, matching the pre-push hook's gate. Checked
      # against the declarations built above rather than a third forced build of the same source.
      - run: npm run api:check:built
      # The committed portable SQLLogicTest profile adds 6,345 result-checked queries without
      # network access. It is intentionally standard local/PR coverage, not a nightly-only net.
      - run: npm run test:sql:standard

  # The unit suite under coverage, in parts. Vitest assigns each file to exactly one of the four
  # shards by a hash of its path. The maintenance workload is a fifth part: it has a deadline, and
  # vitest.config.ts runs it alone rather than beside unrelated database simulators. The shards
  # exclude it by name (`!maintenance`) rather than naming `unit`, so a project added later still
  # runs in them.
  unit:
    name: Unit tests with coverage (${{ matrix.part }})
    runs-on: ubuntu-latest
    # Vitest runs one file's tests serially, so the heaviest file bounds its shard however the rest
    # are spread. That is the schema interaction simulator, whose fake-IndexedDB seeds take about a
    # quarter of an hour under coverage on a hosted runner; the rest of a shard runs beside it.
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        include:
          - part: 1/4
            filter: --project='!maintenance' --shard=1/4
          - part: 2/4
            filter: --project='!maintenance' --shard=2/4
          - part: 3/4
            filter: --project='!maintenance' --shard=3/4
          - part: 4/4
            filter: --project='!maintenance' --shard=4/4
          - part: maintenance
            filter: --project=maintenance
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - run: bash scripts/ci-install.sh
      # The suite imports the packages through their built entry points, and the console snippet
      # tests check against the declaration bundle generated from them. The site itself is built
      # and checked by the static job.
      - run: npm run test:prepare
      # The blob report carries this part's results and coverage to the merge below, which is where
      # the coverage floors are judged.
      - name: Test ${{ matrix.part }}
        run: npm run test:coverage -- ${{ matrix.filter }} --reporter=default --reporter=blob
        env:
          MINNOW_COVERAGE_PART: "1"
      - name: Upload this part's report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: unit-blob-${{ strategy.job-index }}
          path: .vitest-reports/
          include-hidden-files: true
          if-no-files-found: error
          # A rerun of a failed part replaces its earlier report; the merge reads the latest of each.
          overwrite: true
          retention-days: 7

  # Coverage rather than a bare run: the thresholds in vitest.config.ts are a ratchet, and a
  # ratchet nothing turns is just a number in a file. Merged here, they are judged on every part's
  # coverage combined, exactly as one `npm run test:coverage` judges a whole run. It runs after a
  # failed part too, because a failed run is exactly when the report is worth reading.
  coverage:
    name: Unit test results and coverage floors
    needs: unit
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - run: bash scripts/ci-install.sh
      - uses: actions/download-artifact@v8
        with:
          pattern: unit-blob-*
          path: .vitest-reports
          merge-multiple: true
      # Replays every part's results, fails on any failed test, and enforces the coverage floors.
      - name: Merge the parts and enforce the coverage floors
        run: npm run test:coverage -- --merge-reports
      - name: Upload coverage
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: coverage
          path: coverage/
          retention-days: 14

  # Preserve the stable required-check name for what used to be one job: it passes only when the
  # static checks, every unit-test part, and the merged coverage gate all passed.
  check:
    name: Format, types, lint, build, unit tests
    if: always()
    needs: [static, unit, coverage]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Require the static checks, every unit-test part, and the coverage floors
        env:
          STATIC_RESULT: ${{ needs.static.result }}
          UNIT_RESULT: ${{ needs.unit.result }}
          COVERAGE_RESULT: ${{ needs.coverage.result }}
        run: |
          echo "static: $STATIC_RESULT, unit parts: $UNIT_RESULT, coverage: $COVERAGE_RESULT"
          test "$STATIC_RESULT" = "success"
          test "$UNIT_RESULT" = "success"
          test "$COVERAGE_RESULT" = "success"

  memory:
    name: Heap plateau
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - run: bash scripts/ci-install.sh
      # Forced-GC samples across repeated queries, writes, live subscriptions, and database
      # lifecycles. Caches may warm once; a continuing post-warmup climb fails the merge gate.
      - run: npm run soak:memory

  browser-matrix:
    name: Real browser (${{ matrix.name }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        # Firefox and WebKit split their library suites in two: WebKit's macOS runners leave room
        # for one Playwright worker, and Firefox spends up to ten minutes in the SQLLogicTest file
        # alone. Playwright shards whole spec files, so each engine's site suite (two files) runs
        # once, on its first shard.
        include:
          - name: chromium
            browser: chromium
            os: ubuntu-latest
            cache_path: ~/.cache/ms-playwright
            artifact: chromium
            site: true
          - name: firefox 1/2
            browser: firefox
            os: ubuntu-latest
            cache_path: ~/.cache/ms-playwright
            shard: 1/2
            artifact: firefox-1
            site: true
          - name: firefox 2/2
            browser: firefox
            os: ubuntu-latest
            cache_path: ~/.cache/ms-playwright
            shard: 2/2
            artifact: firefox-2
            site: false
          - name: webkit 1/2
            browser: webkit
            os: macos-latest
            cache_path: ~/Library/Caches/ms-playwright
            shard: 1/2
            artifact: webkit-1
            site: true
          - name: webkit 2/2
            browser: webkit
            os: macos-latest
            cache_path: ~/Library/Caches/ms-playwright
            shard: 2/2
            artifact: webkit-2
            site: false
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - run: bash scripts/ci-install.sh
      # Cache each browser against the Playwright version that asks for it.
      - name: Resolve Playwright version
        id: playwright
        run: echo "version=$(node -p "require('@playwright/test/package.json').version")" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@v6
        id: browser
        with:
          path: ${{ matrix.cache_path }}
          key: playwright-${{ runner.os }}-${{ matrix.browser }}-${{ steps.playwright.outputs.version }}
      - name: Install browser
        run: npx playwright install ${{ matrix.browser }}
        if: steps.browser.outputs.cache-hit != 'true'
      - name: Install browser system dependencies
        run: npx playwright install-deps ${{ matrix.browser }}
        if: runner.os == 'Linux'
      - name: Test library in ${{ matrix.name }}
        id: library
        run: npm run test:browser:library -- --project ${{ matrix.browser }} ${{ matrix.shard && format('--shard={0}', matrix.shard) || '' }}
      - name: Upload library reports, traces, and plans
        if: always() && (steps.library.outcome == 'success' || steps.library.outcome == 'failure')
        uses: actions/upload-artifact@v7
        with:
          name: playwright-library-${{ matrix.artifact }}
          path: |
            playwright-report/
            test-results/
          retention-days: 14
      - name: Test site in ${{ matrix.browser }}
        id: site
        if: matrix.site
        run: npm run test:browser:site -- --project ${{ matrix.browser }}
      - name: Upload site reports, traces, and plans
        if: always() && (steps.site.outcome == 'success' || steps.site.outcome == 'failure')
        uses: actions/upload-artifact@v7
        with:
          name: playwright-site-${{ matrix.artifact }}
          path: |
            playwright-report/
            test-results/
          retention-days: 14
      # Pack and install every library outside the workspace, then build and run a real consumer.
      # This catches missing tarball files, dependency ranges, declarations, and worker chunks that
      # workspace links cannot expose. It launches Chromium, so run it once on that installed leg.
      - name: Test packed consumer
        if: matrix.browser == 'chromium'
        run: npm run test:consumer

  # Preserve the stable required-check name while making any failed, cancelled, or skipped matrix
  # result fail the aggregate gate.
  browser:
    name: Real browsers
    if: always()
    needs: browser-matrix
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Require every browser engine
        env:
          BROWSER_MATRIX_RESULT: ${{ needs.browser-matrix.result }}
        run: test "$BROWSER_MATRIX_RESULT" = "success"

  engines-floor-part:
    name: Unit tests on the oldest supported Node (${{ matrix.shard }})
    runs-on: ubuntu-latest
    # The whole unit suite without coverage, in two shards. Node 22 runs the fake-indexeddb
    # simulator seeds about twice as slowly as 24 (40-76 s each); 0.16.0's whole suite passed in
    # 20 minutes there on one runner.
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        shard: [1/2, 2/2]
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          # package.json declares ">=22". This job is what makes that claim true rather than
          # aspirational — node:sqlite in particular moved between 22 and 24.
          node-version: 22
          cache: npm
      - run: bash scripts/ci-install.sh
      - run: npm run build
      # Both projects, so the maintenance workload runs in whichever shard holds it, alone and
      # after that shard's other files, as in a whole run.
      - run: npm run test:unit -- --shard=${{ matrix.shard }}

  # Preserve the stable check name for the oldest-Node gate: it passes only when both shards did.
  engines-floor:
    name: Unit tests on the oldest supported Node
    if: always()
    needs: engines-floor-part
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Require every shard
        env:
          ENGINES_FLOOR_RESULT: ${{ needs.engines-floor-part.result }}
        run: test "$ENGINES_FLOOR_RESULT" = "success"
