# Publishing, driven by the versions in the manifests.
#
# There is no release ritual beyond a version bump: `npm run version:set` writes a new version,
# and once that commit's CI run is green this publishes every package whose version npm does not
# already have, then tags each one. A push that changes no version publishes nothing, and rerunning
# a failed job is safe, because the registry is what decides — not this workflow's history.
#
# It waits for CI rather than repeating the merge gate, then adds the exhaustive SQL, long
# deterministic-simulator, and full real-browser profiles. `workflow_run` fires when CI finishes,
# and no red or skipped gate can reach the registry.
name: Release

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]

# There is no npm token here, and there is no secret to rotate: npm is configured to trust this
# workflow, and `id-token: write` is what lets it prove it is this workflow. The same token signs
# the provenance attestation on each published version. `contents: write` is for the tags.
permissions:
  contents: write
  id-token: write

# Two runs publishing at once would race for the same version.
concurrency: release

jobs:
  conformance:
    name: Release SQL and simulator gate
    if: github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push' && github.event.workflow_run.head_repository.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run test:sql:full
      - run: npm run test:simulator:full

  browser-conformance:
    name: Release browser conformance (${{ matrix.browser }})
    if: github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push' && github.event.workflow_run.head_repository.full_name == github.repository
    runs-on: ${{ matrix.os }}
    timeout-minutes: 360
    strategy:
      fail-fast: false
      matrix:
        include:
          - browser: chromium
            os: ubuntu-latest
            cache_path: ~/.cache/ms-playwright
          - browser: firefox
            os: ubuntu-latest
            cache_path: ~/.cache/ms-playwright
          - browser: webkit
            os: macos-latest
            cache_path: ~/Library/Caches/ms-playwright
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Resolve Playwright version
        id: playwright
        run: echo "version=$(node -p "require('@playwright/test/package.json').version")" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@v6
        id: browser
        with:
          path: ${{ matrix.cache_path }}
          key: playwright-${{ runner.os }}-${{ matrix.browser }}-${{ steps.playwright.outputs.version }}
      - name: Install browser
        run: npx playwright install ${{ matrix.browser }}
        if: steps.browser.outputs.cache-hit != 'true'
      - name: Install browser system dependencies
        run: npx playwright install-deps ${{ matrix.browser }}
        if: runner.os == 'Linux'
      - run: npm run test:browser:conformance -- --project ${{ matrix.browser }}
      - name: Upload browser reports, traces, and plans
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: release-browser-conformance-${{ matrix.browser }}
          path: |
            playwright-report/
            test-results/
          retention-days: 14

  publish:
    name: Publish new versions to npm
    if: github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push' && github.event.workflow_run.head_repository.full_name == github.repository
    needs: [conformance, browser-conformance]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
        with:
          # The commit CI actually tested, which is not necessarily the tip of main by now.
          ref: ${{ github.event.workflow_run.head_sha }}
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
          registry-url: https://registry.npmjs.org
      # Trusted publishing needs npm 11.5.1 or newer, which is newer than some Node 24 images
      # ship. Pinning the major keeps that from being a surprise on a runner-image update.
      - run: npm install --global npm@^11
      - run: npm ci
      # The tarballs are built from source here rather than trusted from CI's artifacts.
      - run: npm run build
      - name: Publish
        run: npm run release:publish
