# Bounded hosted probe for the Firefox OPFS kill-during-publish stall (#26). Branch-only: runs on
# pushes to ci/c1-opfs-probe (or by dispatch); no other workflow triggers on this branch. It repeats
# the spec on hosted Firefox and keeps every attempt's diagnostics (the failure record names the
# iteration, phase, stage, the verifier's last steps, the locks before termination and the handle
# probe after it) and traces.
name: C1 OPFS probe

on:
  push:
    branches: [ci/c1-opfs-probe]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: c1-opfs-probe
  cancel-in-progress: true

jobs:
  firefox-kill-publish:
    name: Firefox kill during publish x20
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      NODE_OPTIONS: --max-old-space-size=4096
    steps:
      - uses: actions/checkout@v5
      - uses: ./.github/actions/install
        with:
          node-version: 24
      - name: Resolve Playwright version
        id: playwright
        run: echo "version=$(node -p "require('@playwright/test/package.json').version")" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@v6
        id: browser
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-firefox-${{ steps.playwright.outputs.version }}
      - name: Install browser
        run: npx playwright install firefox
        if: steps.browser.outputs.cache-hit != 'true'
      - name: Install browser system dependencies
        run: npx playwright install-deps firefox
      - name: Build core
        run: npx tsc -b packages/core --force
      - name: Repeat the kill-during-publish spec on Firefox
        id: probe
        run: >-
          npx playwright test --config playwright.library.config.ts
          packages/core/browser-tests/next-storage.spec.ts --project firefox
          -g "survives a worker killed in every phase of publishing"
          --repeat-each 20 --retries 0 --workers 2 --trace retain-on-failure
          --reporter list,json
        env:
          MINNOW_BROWSER: firefox
          PLAYWRIGHT_JSON_OUTPUT_NAME: probe-report.json
      - name: Upload report, results and traces
        if: always() && (steps.probe.outcome == 'success' || steps.probe.outcome == 'failure')
        uses: actions/upload-artifact@v7
        with:
          name: c1-opfs-probe
          path: |
            probe-report.json
            playwright-report/
            test-results/
          retention-days: 14
