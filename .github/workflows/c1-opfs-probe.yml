# Bounded hosted probe for the Firefox OPFS kill-during-publish stall (#26). Branch-only: runs on
# pushes to ci/c1-opfs-probe (or by dispatch); no other workflow triggers on this branch. Round 2:
# three parallel runs of the whole Firefox library suite (the spec alone passed 20/20) keeping
# every attempt's diagnostics (the failure record names the
# iteration, phase, stage, the verifier's last steps, the locks before termination and the handle
# probe after it) and traces.
name: C1 OPFS probe

on:
  push:
    branches: [ci/c1-opfs-probe]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: c1-opfs-probe
  cancel-in-progress: true

jobs:
  firefox-library:
    name: Firefox full library (repeat ${{ matrix.repeat }})
    runs-on: ubuntu-latest
    timeout-minutes: 75
    env:
      NODE_OPTIONS: --max-old-space-size=4096
    strategy:
      fail-fast: false
      matrix:
        repeat: [1, 2, 3]
    steps:
      - uses: actions/checkout@v5
      - uses: ./.github/actions/install
        with:
          node-version: 24
      - name: Resolve Playwright version
        id: playwright
        run: echo "version=$(node -p "require('@playwright/test/package.json').version")" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@v6
        id: browser
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-firefox-${{ steps.playwright.outputs.version }}
      - name: Install browser
        run: npx playwright install firefox
        if: steps.browser.outputs.cache-hit != 'true'
      - name: Install browser system dependencies
        run: npx playwright install-deps firefox
      # The whole Firefox library suite, where the stall was seen: every spec beside the kill test,
      # on CI's two workers, no retries, traces kept for every failure.
      - name: Full Firefox library suite
        id: probe
        run: >-
          npm run test:browser:library -- --project firefox --retries 0
          --trace retain-on-failure --reporter list,json
        env:
          MINNOW_BROWSER: firefox
          PLAYWRIGHT_JSON_OUTPUT_NAME: probe-report.json
      - name: Upload report, results and traces
        if: always() && (steps.probe.outcome == 'success' || steps.probe.outcome == 'failure')
        uses: actions/upload-artifact@v7
        with:
          name: c1-opfs-probe-library-${{ matrix.repeat }}
          path: |
            probe-report.json
            playwright-report/
            test-results/
          retention-days: 14
