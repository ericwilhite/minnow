# Speed claims for the rebuild engine (next/): the protocol in scripts/next-claim.mts and the
# testing reference's "Speed claims" section. Dispatch only; any claim that next/ is faster, or
# not slower, cites one of these runs. Both refs are resolved to SHAs before anything is built,
# and every table names them.
name: next/ speed claim

on:
  workflow_dispatch:
    inputs:
      candidate:
        description: "Candidate git ref (branch, tag or SHA)"
        required: true
      control:
        description: "Control git ref"
        default: "main"
      targets:
        description: "Comma-separated target cells the claim is about (all others are screened)"
        default: ""
      datasets:
        description: "Datasets"
        default: "both"
        type: choice
        options: [both, W1M, S1]
      pairs:
        description: "Fresh-process pairs per cell (at least 9; 15 lets the 47-cell screen pass Holm)"
        default: "15"
      only:
        description: "Optional comma-separated subset of cells (default: every Gate B cell)"
        default: ""
      shards:
        description: "Jobs per dataset"
        default: "6"
      images:
        description: "Fixture images: auto (one shared image when both builds have the same stored format) or separate (each arm its own, plus an image A/A)"
        default: "auto"
        type: choice
        options: [auto, separate]

permissions:
  contents: read

concurrency:
  # One queue per workflow ref and claim (control, candidate).
  group: next-claim-${{ github.ref }}-${{ inputs.control }}-${{ inputs.candidate }}
  cancel-in-progress: false

# Inputs reach shell steps only through env and quoted expansions. The resolve job validates
# them and declares the run in a manifest; every later job reads the manifest, not the inputs.
jobs:
  resolve:
    name: Declare the run
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      control: ${{ steps.refs.outputs.control }}
      candidate: ${{ steps.refs.outputs.candidate }}
      datasets: ${{ steps.declare.outputs.datasets }}
      shards: ${{ steps.declare.outputs.shards }}
      count: ${{ steps.refs.outputs.count }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v5
        with:
          node-version: 24
      - id: refs
        shell: bash
        env:
          CONTROL: ${{ inputs.control }}
          CANDIDATE: ${{ inputs.candidate }}
          SHARDS: ${{ inputs.shards }}
        run: |
          set -euo pipefail
          for ref in "$CONTROL" "$CANDIDATE"; do
            [[ "$ref" =~ ^[A-Za-z0-9._/-]+$ ]] || { echo "invalid ref: $ref" >&2; exit 1; }
          done
          [[ "$SHARDS" =~ ^[0-9]+$ ]] || { echo "shards must be a number" >&2; exit 1; }
          resolve() { git rev-parse --verify "origin/$1^{commit}" 2>/dev/null || git rev-parse --verify "$1^{commit}"; }
          echo "control=$(resolve "$CONTROL")" >> "$GITHUB_OUTPUT"
          echo "candidate=$(resolve "$CANDIDATE")" >> "$GITHUB_OUTPUT"
          echo "count=$SHARDS" >> "$GITHUB_OUTPUT"
      - id: declare
        shell: bash
        env:
          CONTROL: ${{ steps.refs.outputs.control }}
          CANDIDATE: ${{ steps.refs.outputs.candidate }}
          DATASETS: ${{ inputs.datasets }}
          SHARDS: ${{ inputs.shards }}
          PAIRS: ${{ inputs.pairs }}
          TARGETS: ${{ inputs.targets }}
          ONLY: ${{ inputs.only }}
          IMAGES: ${{ inputs.images }}
        run: |
          set -euo pipefail
          case "$DATASETS" in
            both) DATASETS=W1M,S1 ;;
            W1M|S1) ;;
            *) echo "invalid datasets: $DATASETS" >&2; exit 1 ;;
          esac
          # claimManifest validates pairs, shards and every cell name before declaring the run.
          node scripts/next-claim.mts manifest --control "$CONTROL" --candidate "$CANDIDATE" \
            --datasets "$DATASETS" --shards "$SHARDS" --pairs "$PAIRS" \
            --targets "$TARGETS" --only "$ONLY" --images "$IMAGES" --output manifest.json > matrix.json
          echo "datasets=$(node -p 'JSON.stringify(require("./matrix.json").datasets)')" >> "$GITHUB_OUTPUT"
          echo "shards=$(node -p 'JSON.stringify(require("./matrix.json").shards)')" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@v7
        with:
          name: manifest
          path: manifest.json
          retention-days: 90

  measure:
    name: ${{ matrix.dataset }} shard ${{ matrix.shard }}
    needs: resolve
    runs-on: ubuntu-latest
    # Measured: see the testing reference for the per-shard budget behind six W1M shards.
    timeout-minutes: 240
    strategy:
      fail-fast: false
      matrix:
        dataset: ${{ fromJSON(needs.resolve.outputs.datasets) }}
        shard: ${{ fromJSON(needs.resolve.outputs.shards) }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - run: bash scripts/ci-install.sh
      - uses: actions/download-artifact@v8
        with:
          name: manifest
          path: declared
      - name: Build control and candidate
        shell: bash
        env:
          CONTROL: ${{ needs.resolve.outputs.control }}
          CANDIDATE: ${{ needs.resolve.outputs.candidate }}
        run: |
          set -euo pipefail
          for arm in control candidate; do
            ref=$([ "$arm" = control ] && echo "$CONTROL" || echo "$CANDIDATE")
            git worktree add --detach "$RUNNER_TEMP/$arm" "$ref"
            (cd "$RUNNER_TEMP/$arm" && npm ci --ignore-scripts --no-audit --no-fund && npx tsc -b packages/core)
          done
      - name: Measure
        shell: bash
        env:
          DATASET: ${{ matrix.dataset }}
          SHARD: ${{ matrix.shard }}
          SHARDS: ${{ needs.resolve.outputs.count }}
          SEED: ${{ github.run_id }}
        run: |
          set -euo pipefail
          mkdir -p claim
          node scripts/next-claim.mts run --manifest declared/manifest.json \
            --dataset "$DATASET" --shard "$SHARD/$SHARDS" --seed "$SEED" \
            --control "$RUNNER_TEMP/control" --candidate "$RUNNER_TEMP/candidate" \
            --output "$RUNNER_TEMP/claim" \
            2> >(tee "claim/$DATASET-$SHARD.log" >&2) | tee "claim/$DATASET-$SHARD.md"
          cp "$RUNNER_TEMP"/claim/claim-*.json claim/
      - if: always()
        uses: actions/upload-artifact@v7
        with:
          name: claim-${{ matrix.dataset }}-${{ matrix.shard }}
          path: claim/
          retention-days: 90

  report:
    name: Claim table
    needs: [resolve, measure]
    if: always() && needs.resolve.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
      - uses: actions/download-artifact@v8
        with:
          name: manifest
          path: declared
      - uses: actions/download-artifact@v8
        with:
          pattern: claim-*
          path: results
          merge-multiple: true
      - name: Write the table
        shell: bash
        run: |
          set -euo pipefail
          shopt -s nullglob
          files=(results/claim-*.json)
          # With missing shards the report still runs: it marks the run INCOMPLETE, no verdicts.
          node scripts/next-claim.mts report --manifest declared/manifest.json "${files[@]}" | tee claim.md >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v7
        with:
          name: claim-table
          path: claim.md
          retention-days: 90
