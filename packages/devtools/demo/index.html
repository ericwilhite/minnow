<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Minnow devtools demo</title>
    <style>
      :root {
        color-scheme: light dark;
        font-family:
          ui-sans-serif,
          -apple-system,
          BlinkMacSystemFont,
          "Segoe UI",
          sans-serif;
      }
      body {
        margin: 0;
        padding: 32px;
        max-width: 46rem;
        line-height: 1.6;
      }
      h1 {
        font-size: 20px;
        margin: 0 0 4px;
      }
      p {
        margin: 0 0 16px;
        opacity: 0.7;
      }
      button.host {
        font: inherit;
        padding: 6px 12px;
        border-radius: 6px;
        border: 1px solid currentColor;
        background: transparent;
        color: inherit;
        cursor: pointer;
      }
      output {
        display: block;
        margin-top: 12px;
        font-family: ui-monospace, Menlo, monospace;
        font-size: 13px;
        opacity: 0.7;
      }
    </style>
  </head>
  <body>
    <h1>Host page</h1>
    <p>
      The devtools panel floats over this page. Everything here must stay clickable while the panel
      is open — that is the point of a non-modal window.
    </p>
    <button class="host" id="ping" type="button">Click me while the panel is open</button>
    <output id="log">no clicks yet</output>
    <script type="module" src="./main.ts"></script>
  </body>
</html>
